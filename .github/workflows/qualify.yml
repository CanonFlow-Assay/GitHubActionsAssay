name: Qualify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python eng/qualify.py
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('artifacts/qualification/**') != ''
        with:
          name: assay-qualification
          path: |
            artifacts/qualification/
            artifacts/*.pyz
